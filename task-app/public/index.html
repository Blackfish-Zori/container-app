<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Task Manager</h1>
      <p class="app__subtitle">Stay on top of what needs doing.</p>
    </header>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        class="task-form__input"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
        required
      />
      <button type="submit" class="task-form__submit">Add Task</button>
    </form>

    <div class="task-meta">
      <div class="filters" id="filters">
        <button class="filter-btn is-active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <span id="task-count" class="task-count"></span>
    </div>

    <div id="status-banner" class="status-banner" hidden></div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state" hidden>No tasks yet. Add one above!</p>
  </div>

  <template id="task-item-template">
    <li class="task-item">
      <label class="task-item__label">
        <input type="checkbox" class="task-item__checkbox" />
        <span class="task-item__title"></span>
      </label>
      <button class="task-item__delete" title="Delete task" aria-label="Delete task">✕</button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
