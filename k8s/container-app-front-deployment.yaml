apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-front-dep
  namespace: default
  labels:
    app: app-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-front
  template:
    metadata:
      labels:
        app: app-front
    spec:
      containers:
        - name: app-front-container
          image: zorislavsic/blackfish:app-front-12
          ports:
            - containerPort: 80
              name: http
