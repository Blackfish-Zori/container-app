# Use this INSTEAD of mongodb-external-service.yaml if your external MongoDB
# is only reachable by IP address (no DNS name available).
# Replace 203.0.113.10 with the actual IP, and adjust the port if needed.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongodb
subsets:
  - addresses:
      - ip: 203.0.113.10
    ports:
      - port: 27017
